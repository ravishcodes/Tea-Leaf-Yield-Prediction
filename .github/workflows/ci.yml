name: Tea Leaf Yield Prediction CI

on:
  push:
  pull_request:
    branches: [main]
jobs:
  # ----------------------------------------------------------------
  # Job 1: Unit, integration and manifest tests
  # ----------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run synthetic data cleaning tests
        run: |
          python -m pytest tests/test_cleaning_pipeline.py -v

      - name: Run model and API tests
        run: |
          python -m pytest tests/test_model_artifact.py tests/test_api.py -v

      - name: Run deployment and manifest tests
        run: |
          python -m pytest tests/test_deployment.py -v

      - name: Run monitoring, retraining and holdout tests
        run: |
          python -m pytest tests/test_monitoring.py tests/test_retraining.py tests/test_holdout_predictions.py -v

  # ----------------------------------------------------------------
  # Job 2: Docker build, container run and HTTP smoke tests
  # ----------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t mp148-api:1.0 .

      - name: Start container
        run: |
          docker run -d --name mp148-api -p 8000:8000 mp148-api:1.0

      - name: Wait for container startup
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Container is healthy"
              break
            fi
            echo "Waiting for container... attempt $i"
            sleep 2
          done

      - name: Health endpoint smoke test
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status'] == 'ok', d; assert d['model_loaded'] is True, 'Model not loaded'; assert d['model_version'] == 4, d"

      - name: Readiness endpoint smoke test
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/ready)
          echo "Readiness response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status'] == 'ready', 'Service not ready'; assert d['model_version'] == 4, d"

      - name: Valid prediction smoke test
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"worker_exp_yr":12,"rain_mm_week":150,"slope_deg":17,"temp_c":25,"bush_age_yr":10,"hours_worked":6,"flush":"monsoon","section":"River Side"}')
          echo "Prediction response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); assert 'predicted_yield_kg_per_worker' in d, 'Missing prediction key'; assert d['model_version'] == 4, d"

      - name: Invalid input smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"worker_exp_yr":"invalid"}')
          echo "Invalid input status: $STATUS"
          [ "$STATUS" = "422" ] || (echo "Expected 422, got $STATUS" && exit 1)

          STATUS_HOURS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"worker_exp_yr":12,"rain_mm_week":150,"slope_deg":17,"temp_c":25,"bush_age_yr":10,"hours_worked":16,"flush":"monsoon","section":"River Side"}')
          echo "Invalid hours_worked status: $STATUS_HOURS"
          [ "$STATUS_HOURS" = "422" ] || (echo "Expected 422, got $STATUS_HOURS" && exit 1)

          STATUS_RAIN=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"worker_exp_yr":12,"rain_mm_week":-5,"slope_deg":17,"temp_c":25,"bush_age_yr":10,"hours_worked":6,"flush":"monsoon","section":"River Side"}')
          echo "Invalid rain_mm_week status: $STATUS_RAIN"
          [ "$STATUS_RAIN" = "422" ] || (echo "Expected 422, got $STATUS_RAIN" && exit 1)

      - name: Verify JSON log format
        run: |
          echo "=== DOCKER LOGS (VERIFYING JSON FORMAT) ==="
          docker logs mp148-api
          docker logs mp148-api | python3 -c "import sys, json
lines = [l.strip() for l in sys.stdin if l.strip()]
valid_json_count = 0
for line in lines:
    try:
        data = json.loads(line)
        valid_json_count += 1
    except Exception:
        pass
print(f'Parsed {valid_json_count} valid JSON log lines from container stdout')
assert valid_json_count > 0, 'No valid JSON lines found in container output'
"

      - name: Cleanup container
        if: always()
        run: |
          docker stop mp148-api || true
          docker rm mp148-api || true

  # ----------------------------------------------------------------
  # Job 3: Kubernetes deployment smoke test with kind
  # ----------------------------------------------------------------
  kubernetes:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        run: |
          kind create cluster --name kind --wait 120s

      - name: Build Docker image
        run: |
          docker build -t mp148-api:1.0 .

      - name: Load image into kind cluster
        run: |
          kind load docker-image mp148-api:1.0 --name kind

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/mp148-api --timeout=180s || {
            echo "=== ROLLOUT FAILED: POD STATUS ==="
            kubectl get pods -o wide
            echo "=== DESCRIBE PODS ==="
            kubectl describe pods -l app=mp148-api
            echo "=== CLUSTER EVENTS ==="
            kubectl get events --sort-by='.lastTimestamp'
            exit 1
          }

      - name: Verify pods and service
        run: |
          kubectl get pods -o wide
          kubectl get services
          kubectl get endpointslices
          # Verify 4 replicas are present
          REPLICAS=$(kubectl get deployment mp148-api -o jsonpath='{.status.readyReplicas}')
          echo "Ready replicas: $REPLICAS"
          [ "$REPLICAS" = "4" ] || (echo "Expected 4 ready replicas, got $REPLICAS" && exit 1)

      - name: Test service via port-forward
        run: |
          kubectl port-forward service/mp148-svc 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/health | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status'] == 'ok' and d['model_version'] == 4, d"
          curl -sf http://localhost:8080/ready
          RESPONSE=$(curl -sf -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"worker_exp_yr":12,"rain_mm_week":150,"slope_deg":17,"temp_c":25,"bush_age_yr":10,"hours_worked":6,"flush":"monsoon","section":"River Side"}')
          echo "K8s prediction response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); assert 'predicted_yield_kg_per_worker' in d and d['model_version'] == 4, d"

      - name: Deployment logs
        if: always()
        run: |
          kubectl logs -l app=mp148-api --tail=50 || true
