apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp148-api
  labels:
    app: mp148-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp148-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mp148-api
    spec:
      containers:
        - name: mp148-api
          image: mp148-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          # Startup probe — allow time for initial model loading
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12       # Up to 60s for model loading
          # Readiness probe — route traffic only when model is confirmed loaded
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Liveness probe — restart if unresponsive (waits longer than readiness)
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
